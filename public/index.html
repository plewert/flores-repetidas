<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌸 Flores Repetidas</title>
<style>
:root{--c:#00e5ff;--m:#ff2bd6;--tx:#e6f7ff;--su:#7fa3b8;--bo:rgba(0,229,255,.4);--pn:rgba(8,14,34,.74)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:14px;background:radial-gradient(ellipse at 50% 0%,#14235a 0%,#070b1f 60%,#03050f 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:36px 36px;animation:mv 14s linear infinite}
@keyframes mv{to{background-position:0 36px,36px 0}}
main{width:100%;max-width:520px;position:relative;z-index:1}
h1{text-align:center;margin:6px 0 14px;font-size:1.6rem;text-transform:uppercase;letter-spacing:4px;font-weight:800;color:var(--c);text-shadow:0 0 8px var(--c),0 0 26px rgba(0,229,255,.6)}
.p{background:var(--pn);border:1px solid var(--bo);border-radius:6px;padding:16px;margin-bottom:12px;box-shadow:0 0 18px rgba(0,229,255,.15),inset 0 0 24px rgba(0,229,255,.05);backdrop-filter:blur(6px)}
input,select{width:100%;padding:11px;font:inherit;font-size:1rem;border-radius:4px;border:1px solid var(--bo);background:rgba(0,10,30,.65);color:var(--tx);margin-bottom:8px;outline:0}
input:focus,select:focus{border-color:var(--c);box-shadow:0 0 12px rgba(0,229,255,.5)}
input::placeholder{color:var(--su)}option{color:#111}
button{width:100%;padding:12px;font:inherit;font-size:.9rem;border:1px solid var(--c);background:linear-gradient(90deg,rgba(0,229,255,.22),rgba(255,43,214,.22));color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;margin-bottom:10px;text-shadow:0 0 8px var(--c);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.5)}button:active{transform:scale(.98)}
button.s{background:transparent;border-color:var(--bo);color:var(--c)}
.oc{display:none!important}.c0{text-align:center;color:var(--su)}
.cod{font:700 2.4rem ui-monospace,Consolas,monospace;letter-spacing:10px;text-align:center;color:var(--m);text-shadow:0 0 10px var(--m),0 0 28px rgba(255,43,214,.6)}
.js{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.j{flex:1 1 30%;padding:6px 10px;border-radius:4px;border:2px solid var(--bo);background:rgba(0,10,30,.65);font-size:.82rem}
.j.t{box-shadow:0 0 16px var(--c),inset 0 0 12px rgba(0,229,255,.25)}.j.x{opacity:.35;text-decoration:line-through}
.tab{display:grid;gap:8px;padding:14px;border-radius:6px;background:rgba(0,10,30,.55);border:1px solid var(--c);box-shadow:0 0 22px rgba(0,229,255,.35),inset 0 0 30px rgba(0,229,255,.08)}
.c{aspect-ratio:4/5;perspective:700px;cursor:pointer;user-select:none}
.in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.c.volteada .in,.c.emparejada .in{transform:rotateY(180deg)}
.c.oculta:hover .in{transform:translateY(-3px)}.c.emparejada{cursor:default}
.f{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.b{background:radial-gradient(circle,#00e5ff 0 4%,rgba(0,229,255,.25) 5% 12%,transparent 13%),repeating-linear-gradient(60deg,rgba(0,229,255,.2) 0 1px,transparent 1px 10px),repeating-linear-gradient(-60deg,rgba(255,43,214,.17) 0 1px,transparent 1px 10px),linear-gradient(135deg,#0b1a4a,#1a0b3a);border:1px solid var(--c);box-shadow:0 0 10px rgba(0,229,255,.5),inset 0 0 12px rgba(0,229,255,.3)}
.a{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#16356b,#070b1f);border:1px solid var(--m);box-shadow:0 0 12px rgba(255,43,214,.55)}
.a{filter:drop-shadow(0 0 5px rgba(0,229,255,.6))}
.c.emparejada .a{border-color:#39ff88;background:radial-gradient(circle at 50% 40%,#0f5a3a,#06201a);box-shadow:0 0 16px 2px rgba(57,255,136,.8)}
.t4 .a{font-size:clamp(1.8rem,10vw,3rem)}.t6 .a{font-size:clamp(1.1rem,6vw,1.9rem)}
.m{text-align:center;font-weight:700;min-height:1.5em;margin:10px 0;color:var(--c);letter-spacing:1px;text-shadow:0 0 8px rgba(0,229,255,.7)}.er{color:#ff7b9c;text-align:center;min-height:1.3em}
#bw{height:8px;background:rgba(0,229,255,.12);border:1px solid var(--bo);border-radius:4px;margin-bottom:10px;overflow:hidden}#barra{height:100%;background:linear-gradient(90deg,#00e5ff,#ff2bd6);box-shadow:0 0 10px #00e5ff;width:0;transition:width .2s linear}
#log{height:90px;overflow:auto;font:.82rem ui-monospace,Consolas,monospace;margin-bottom:6px;background:rgba(0,10,30,.55);border:1px solid var(--bo);border-radius:4px;padding:6px}
</style></head><body><main>
<h1>🌸 Flores Repetidas</h1>
<section id="inicio" class="p">
 <input id="nombre" placeholder="Tu nombre" maxlength="16">
 <button id="bSolo" class="s">🎯 Entrenar solo</button>
 <button id="bLibre">Crear partida libre (2-4)</button>
 <button id="bTorneo">🏆 Crear torneo (hasta 10)</button>
 <button id="bBuscar">⚡ Buscar partida rápida (1 vs 1)</button><button id="bCancel" class="s oc">✖ Cancelar búsqueda</button>
 <p class="c0">— o únete con un código —</p>
 <input id="cIn" placeholder="CÓDIGO" maxlength="4" style="text-transform:uppercase;text-align:center;letter-spacing:6px">
 <button id="bUnir" class="s">Unirse</button><div id="eI" class="er"></div>
</section>
<section id="solo" class="p oc">
 <select id="sTam"><option value="4">Tablero 4x4</option><option value="6">Tablero 6x6</option></select>
 <select id="sDif"><option value="1500">Fácil (cartas visibles 1.5s)</option><option value="700">Difícil (0.7s)</option></select>
 <button id="bNueva">Nueva partida</button>
 <div id="sInfo" class="m"></div><div id="tabS"></div><div id="sRes" class="m"></div>
 <button id="bVolver1" class="s">Volver</button>
</section>
<section id="espera" class="p oc">
 <p class="c0">Código de la sala:</p><div id="cSala" class="cod"></div>
 <div id="lE" class="js"></div>
 <div id="cfg"><select id="cModo"><option value="libre">Partida libre (2-4)</option><option value="torneo">Torneo eliminatorio (2-10)</option></select>
 <select id="cTam"><option value="4">Tablero 4x4</option><option value="6">Tablero 6x6</option></select>
 <button id="bIni">Iniciar</button></div>
 <button id="bSalirE" class="s">⬅ Salir de la sala</button><p id="mE" class="c0"></p><div id="eE" class="er"></div>
</section>
<section id="juego" class="oc">
 <div id="hd" class="c0"></div><div id="mar" class="js"></div>
 <div id="bw"><div id="barra"></div></div>
 <div id="tab"></div><div id="msg" class="m"></div>
 <div id="fin" class="oc"><button id="bOtra">Jugar otra vez</button></div>
 <button id="bSalir" class="s">⬅ Salir de la partida</button>
 <div class="p" style="margin-top:10px"><div id="log"></div><input id="ch" placeholder="Escribe y pulsa Enter" maxlength="120" style="margin:0"></div>
</section></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),FL=["🌹","🌻","🌷","🌸","🌼","🌺","💐","🪻","🪷","🏵️","🌿","🍀","🌵","🌴","🌱","🍁","🍄","🌾"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mez=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nom=()=>$("nombre").value.trim()||"Jugador",ver=id=>["inicio","solo","espera","juego"].forEach(x=>$(x).classList.toggle("oc",x!==id));
let ac;function son(t){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),f={ok:[660,880],no:[220,160],fin:[523,784,1046]}[t];o.connect(g);g.connect(ac.destination);f.forEach((x,i)=>o.frequency.setValueAtTime(x,ac.currentTime+i*.12));g.gain.value=.08;o.start();o.stop(ac.currentTime+f.length*.12+.05)}catch(e){}}
function tab(el,cs,tam,fn){
 if(el.dataset.n!=cs.length+"-"+tam){el.dataset.n=cs.length+"-"+tam;el.className="tab t"+tam;el.style.gridTemplateColumns=`repeat(${tam},1fr)`;
  el.innerHTML=cs.map(()=>'<div class="c"><div class="in"><div class="f b"></div><div class="f a"></div></div></div>').join("")}
 [...el.children].forEach((d,i)=>{const c=cs[i];d.className="c "+c.e;if(c.f)d.querySelector(".a").textContent=c.f;d.onclick=c.e==="oculta"?()=>fn(i):null})}
// ---------- SOLO ----------
let S;const rk=()=>"fr-"+S.tam+"-"+S.ms,mejor=()=>{try{return localStorage.getItem(rk())}catch(e){return null}};
$("bSolo").onclick=()=>{ver("solo");nueva()};$("bVolver1").onclick=()=>ver("inicio");$("bNueva").onclick=nueva;
function nueva(){const tam=+$("sTam").value,fl=mez([...FL]).slice(0,tam*tam/2);
 S={tam,ms:+$("sDif").value,cs:mez([...fl,...fl]).map(f=>({f,e:"oculta"})),vol:[],bloq:false,mov:0,par:0,t0:0};$("sRes").textContent="";pS()}
function pS(){tab($("tabS"),S.cs,S.tam,clicS);$("sInfo").textContent=`Movimientos: ${S.mov} · Parejas: ${S.par}/${S.cs.length/2}`+(mejor()?` · Récord: ${mejor()}`:"")}
function clicS(i){if(S.bloq)return;if(!S.t0)S.t0=Date.now();S.cs[i].e="volteada";S.vol.push(i);if(S.vol.length<2)return pS();
 S.mov++;const[a,b]=S.vol;S.vol=[];
 if(S.cs[a].f===S.cs[b].f){S.cs[a].e=S.cs[b].e="emparejada";S.par++;son("ok");pS();
  if(S.par*2===S.cs.length){son("fin");let ex="";try{const r=mejor();if(!r||S.mov<+r){localStorage.setItem(rk(),S.mov);ex=" · ¡Nuevo récord!"}}catch(e){}
   $("sRes").textContent=`🏆 ¡Listo! ${S.mov} movimientos en ${Math.round((Date.now()-S.t0)/1000)}s`+ex}}
 else{S.bloq=true;son("no");pS();setTimeout(()=>{S.cs[a].e=S.cs[b].e="oculta";S.bloq=false;pS()},S.ms)}}
// ---------- ONLINE ----------
const socket=io(),sv=()=>{try{return JSON.parse(localStorage.getItem("fr-sesion"))}catch(e){return null}};
let E=null,miId=null,lim=0;
const guardar=(c,t)=>{miId=t;try{localStorage.setItem("fr-sesion",JSON.stringify({codigo:c,token:t}))}catch(e){}};
socket.on("connect",()=>{const s=sv();if(s)socket.emit("reconectar",s,r=>{if(r.ok)miId=s.token;else try{localStorage.removeItem("fr-sesion")}catch(e){}})});
const crear=modo=>socket.emit("crearSala",{nombre:nom(),modo,tam:4},r=>{if(r.ok)guardar(r.codigo,r.token)});
$("bLibre").onclick=()=>crear("libre");$("bTorneo").onclick=()=>crear("torneo");
const busc=on=>{$("bBuscar").classList.toggle("oc",on);$("bCancel").classList.toggle("oc",!on);$("eI").textContent=on?"🔎 Buscando rival… (no cierres la página)":""};
$("bBuscar").onclick=()=>{socket.emit("buscar",{nombre:nom()});busc(true)};$("bCancel").onclick=()=>{socket.emit("cancelar");busc(false)};
socket.on("emparejado",r=>{busc(false);guardar(r.codigo,r.token);socket.emit("reconectar",{codigo:r.codigo,token:r.token},()=>{})});
$("bUnir").onclick=()=>socket.emit("unirseSala",{codigo:$("cIn").value,nombre:nom()},r=>r.ok?guardar(r.codigo,r.token):$("eI").textContent=r.error);
$("bIni").onclick=$("bOtra").onclick=()=>socket.emit("iniciar",null,r=>$("eE").textContent=r.ok?"":r.error||"");
$("cModo").onchange=()=>socket.emit("config",{modo:$("cModo").value});$("cTam").onchange=()=>socket.emit("config",{tam:+$("cTam").value});
$("ch").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){socket.emit("chat",e.target.value);e.target.value=""}};
const salir=()=>{if(E&&(E.fase==="jugando"||E.fase==="pausa")&&E.juegan.includes(miId)&&!confirm("¿Salir de la partida? Tu rival ganará."))return;
 socket.emit("salir");try{localStorage.removeItem("fr-sesion")}catch(e){}E=null;miId=null;$("log").innerHTML="";$("eE").textContent="";ver("inicio")};
$("bSalir").onclick=$("bSalirE").onclick=salir;
socket.on("chat",m=>{$("log").insertAdjacentHTML("beforeend",`<div><b style="color:${m.c}">${esc(m.n)}:</b> ${esc(m.t)}</div>`);$("log").scrollTop=1e9});
socket.on("sonido",son);
socket.on("estado",e=>{if(!miId)return;E=e;lim=Date.now()+e.rest;pintar()});
const chip=(j,e)=>`<div class="j ${j.id===e.turno&&e.fase==="jugando"?"t":""} ${j.elim?"x":""}" style="border-color:${j.color}"><b style="color:${j.color}">${esc(j.nombre)}${j.id===miId?" (tú)":""}</b>${j.conectado?"":" ⚠️"}<br>🏆${j.victorias}${e.juegan.includes(j.id)?" · 🌸"+j.puntos:""}</div>`;
function pintar(){const e=E,soyH=e.host===miId;
 if(e.fase==="espera"){ver("espera");$("cSala").textContent=e.codigo;$("lE").innerHTML=e.jugadores.map(j=>chip(j,e)).join("");
  $("cfg").classList.toggle("oc",!soyH);$("cModo").value=e.modo;$("cTam").value=e.tam;
  $("mE").textContent=soyH?"Comparte el código y pulsa Iniciar.":`Modo: ${e.modo==="torneo"?"torneo":"libre"} · Esperando al anfitrión…`;return}
 ver("juego");$("hd").textContent=(e.modo==="torneo"?"🏆 Torneo · Ronda "+e.ronda:"Partida libre")+" · Sala "+e.codigo;
 $("mar").innerHTML=e.jugadores.map(j=>chip(j,e)).join("");
 const mi=e.turno===miId&&e.fase==="jugando",q=e.jugadores.find(j=>j.id===e.turno);
 tab($("tab"),e.cartas,e.tam,i=>{if(mi)socket.emit("voltear",{i})});
 $("msg").textContent=e.aviso||(e.fase==="jugando"?(mi?"👉 ¡Es tu turno!":e.juegan.includes(miId)||e.modo==="libre"?`Turno de ${q?q.nombre:"…"}`:`👀 Mirando · turno de ${q?q.nombre:"…"}`):"");
 $("fin").classList.toggle("oc",!(e.fase==="fin"&&soyH))}
setInterval(()=>{$("barra").style.width=E&&E.fase==="jugando"?Math.max(0,(lim-Date.now())/200)+"%":"0"},200);
</script></body></html>
